<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbit Dodge · Vistra Arcade</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    body { align-items: center; justify-content: center; }
    canvas { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; max-width: 95vw; touch-action: none; }
    .bar { display: flex; justify-content: space-between; width: min(600px, 95vw); padding: .5rem 0; }
    .bar a { color: var(--primary); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="bar">
    <a href="../../">← Arcade</a>
    <span>Récord: <strong id="best">0</strong></span>
  </div>
  <canvas id="game" width="600" height="600"></canvas>
  <p class="bar" style="color: var(--muted)">← → o A/D para girar · toca izquierda/derecha en móvil · Espacio para empezar</p>
  <script src="game.js"></script>
</body>
</html>
