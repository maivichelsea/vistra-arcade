<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Banderas de varios países con un cronómetro">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3a5c"/>
      <stop offset="1" stop-color="#2f27ce"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".6">
      <stop offset="0" stop-color="#5fd3dd" stop-opacity=".35"/>
      <stop offset="1" stop-color="#5fd3dd" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c1"><rect x="0" y="0" width="84" height="56" rx="6"/></clipPath>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>
  <rect width="320" height="180" fill="url(#glow)"/>
  <!-- Colombia -->
  <g transform="translate(34 28) rotate(-8)">
    <g clip-path="url(#c1)"><rect width="84" height="28" fill="#fcd116"/><rect y="28" width="84" height="14" fill="#003893"/><rect y="42" width="84" height="14" fill="#ce1126"/></g>
    <rect width="84" height="56" rx="6" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>
  </g>
  <!-- Japón -->
  <g transform="translate(128 18)">
    <rect width="84" height="56" rx="6" fill="#fff"/><circle cx="42" cy="28" r="16" fill="#bc002d"/>
  </g>
  <!-- Francia -->
  <g transform="translate(220 30) rotate(7)">
    <g clip-path="url(#c1)"><rect width="28" height="56" fill="#002395"/><rect x="28" width="28" height="56" fill="#fff"/><rect x="56" width="28" height="56" fill="#ed2939"/></g>
  </g>
  <!-- Alemania -->
  <g transform="translate(70 100) rotate(5)">
    <g clip-path="url(#c1)"><rect width="84" height="19" fill="#111"/><rect y="19" width="84" height="19" fill="#dd0000"/><rect y="38" width="84" height="18" fill="#ffce00"/></g>
  </g>
  <!-- Cronómetro -->
  <g transform="translate(212 92)">
    <circle cx="36" cy="40" r="34" fill="#14113d" stroke="#ffb347" stroke-width="5"/>
    <rect x="30" y="0" width="12" height="9" rx="2" fill="#ffb347"/>
    <path d="M36 40 V20" stroke="#ffb347" stroke-width="5" stroke-linecap="round"/>
    <path d="M36 40 L50 48" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="36" cy="40" r="4" fill="#fff"/>
  </g>
  <circle cx="186" cy="150" r="5" fill="#ff5a4e"/><rect x="290" y="22" width="9" height="9" rx="2" fill="#ffb347" transform="rotate(20 294 26)"/>
</svg>
